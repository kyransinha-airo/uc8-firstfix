# Local PostgreSQL for development.
#   docker compose -f docker-compose.postgres.yml up -d
#   DATABASE_URL=postgresql://poc:poc@localhost:5438/poc
# Port 5438 so it never clashes with Verity (5433) or another local Postgres on 5432.
# Local development only: the password is not a secret.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: poc
    ports:
      - "5438:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
